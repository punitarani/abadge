name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  # §AB-0102 — keyless cosign signing exchanges this OIDC token at Fulcio.
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      # §AB-0102 — provenance tooling for the publish step (SBOM + signing).
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Validate pending release changesets
        run: bun scripts/releases/check-changeset.ts --validate-pending

      - name: Create version PR or publish release assets
        uses: changesets/action@v1
        with:
          version: bun run version:packages
          publish: bun run release:publish
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
