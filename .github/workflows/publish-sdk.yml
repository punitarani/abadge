name: Publish SDK

on:
  push:
    tags:
      - "sdk-v*.*.*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-sdk-${{ github.ref_name }}
  cancel-in-progress: false

env:
  CI: "1"
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

jobs:
  publish:
    name: Publish @abadge/sdk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install npm for trusted publishing
        run: npm install --global npm@11.5.1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify release tag matches packages/sdk version
        env:
          SDK_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          sdk_version="${SDK_TAG#sdk-v}"
          package_version="$(node -p "require('./packages/sdk/package.json').version")"

          if [[ "$sdk_version" != "$package_version" ]]; then
            echo "Tag version ($sdk_version) does not match packages/sdk/package.json version ($package_version)." >&2
            exit 1
          fi

          echo "Version verified: $sdk_version"

      - name: Verify tag commit is reachable from origin/main
        run: |
          set -euo pipefail

          git fetch origin main --no-tags

          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"; then
            echo "Tag commit $GITHUB_SHA is not reachable from origin/main." >&2
            exit 1
          fi

      - name: Typecheck SDK
        run: bunx turbo run typecheck --filter=@abadge/sdk

      - name: Build SDK
        run: bunx turbo run build --filter=@abadge/sdk

      - name: Validate npm package contents
        working-directory: packages/sdk
        run: npm pack --dry-run

      - name: Publish to npm
        working-directory: packages/sdk
        run: npm publish --provenance
