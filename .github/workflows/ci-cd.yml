name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

env:
  CI: "1"
  # Remote cache (optional): set repo var TURBO_TEAM + secret TURBO_TOKEN — see docs/CI.md
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

permissions:
  contents: read

# Cancel superseded in-progress runs for the same ref so rapid pushes to a PR
# don't stack up full pipelines. Gated to pull_request events: a push to main
# must never be cancelled mid-deploy/migration, so those runs queue instead.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changeset-check:
    name: Changeset Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Require a changeset for release-surface changes
        run: bun scripts/releases/check-changeset.ts --base-ref "${{ github.event.pull_request.base.ref }}"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # `bun run lint` is `biome check`, which enforces formatting, lint rules,
      # and import order in one pass — so there is no separate format job.
      - run: bun run lint

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # AB-0101/AB-0104 — blocking gate: fail on any high/critical advisory that
      # is not in .audit-allowlist.toml. Each allowlist entry carries a
      # justification and an expiry; an expired entry also fails the build, so
      # suppressions can't become permanent. See scripts/ci/audit-check.ts.
      - name: Audit dependencies (high/critical)
        run: bun scripts/ci/audit-check.ts

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # Persist Turbo's local cache so unchanged packages skip typecheck (and the
      # `^build` it depends on) across runs. Typecheck gates 5 downstream jobs,
      # so a cache hit here shortens the whole critical path.
      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-typecheck-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-typecheck-${{ runner.os }}-
      - run: bun run typecheck

  test-unit:
    name: Test (unit, with coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: bun run test:cov:unit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-unit
          path: coverage/unit/lcov.info
          if-no-files-found: error

  test-integration:
    name: Test (integration, with coverage)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: abadge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d abadge_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/abadge_test
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: bun run test:cov:integration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-integration
          path: coverage/integration/lcov.info
          if-no-files-found: error

  test-web:
    name: Test (web, no coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: bun run --cwd apps/web test

  coverage-comment:
    name: Coverage PR comment
    runs-on: ubuntu-latest
    needs: [test-unit, test-integration]
    if: always() && github.event_name == 'pull_request'
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      # comment.ts imports only node: builtins and a type-only sibling, so this
      # job needs the Bun runtime but no workspace deps — skip the install.
      - uses: ./.github/actions/setup
        with:
          install: "false"
      - uses: actions/download-artifact@v4
        with:
          name: coverage-unit
          path: coverage/unit
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with:
          name: coverage-integration
          path: coverage/integration
        continue-on-error: true
      # Restore the latest coverage from `main` (saved by the coverage-baseline
      # job). Branch caches can read the default-branch cache, so this resolves
      # to main's tip via the restore-keys prefix. A miss is fine — the comment
      # script falls back to a "no baseline yet" note.
      - name: Restore coverage baseline from main
        id: baseline
        uses: actions/cache/restore@v4
        with:
          path: |
            baseline/unit/lcov.info
            baseline/integration/lcov.info
          key: coverage-baseline-${{ github.sha }}
          restore-keys: |
            coverage-baseline-
      - name: Build coverage comment
        env:
          COVERAGE_BASELINE_KEY: ${{ steps.baseline.outputs.cache-matched-key }}
        run: bun scripts/coverage/comment.ts
      - uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: coverage
          path: coverage-comment.md

  coverage-baseline:
    name: Coverage baseline (main)
    runs-on: ubuntu-latest
    needs: [test-unit, test-integration]
    # Push-to-main only: snapshot main's coverage into the Actions cache so PR
    # runs can diff against it. PRs read this via the default-branch cache.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: coverage-unit
          path: baseline/unit
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with:
          name: coverage-integration
          path: baseline/integration
        continue-on-error: true
      - name: Save coverage baseline to cache
        uses: actions/cache/save@v4
        # Stay green even if both artifact downloads were skipped (no lcov on
        # the runner): a missing baseline this run just keeps the prior one.
        continue-on-error: true
        with:
          path: |
            baseline/unit/lcov.info
            baseline/integration/lcov.info
          key: coverage-baseline-${{ github.sha }}

  e2e:
    name: E2E (API + CLI + MCP)
    runs-on: ubuntu-latest
    needs: [typecheck]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: abadge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d abadge_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/abadge_test
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # `bun run test:e2e` is `turbo test:e2e`, whose dependsOn builds the CLI
      # and MCP binaries (@abadge/cli#build, @abadge/mcp#build) first; the e2e
      # harness auto-detects and spawns those compiled artifacts. No separate
      # build step needed.
      # The two compile tasks are cache: false, but their `^build` library
      # dependencies (e.g. @abadge/sdk) are cacheable — persist .turbo so those
      # hit the local cache between runs even when the remote cache is unset.
      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-e2e-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-e2e-${{ runner.os }}-
      - name: Run e2e tests
        run: bun run test:e2e

  build-api:
    name: API Server (Workers)
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-build-api-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-build-api-${{ runner.os }}-
      - run: bunx turbo run build --filter=@abadge/api

  build-cli:
    name: CLI (Binary)
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: bun run --cwd packages/cli build

  build-web:
    name: Web App (Workers)
    runs-on: ubuntu-latest
    needs: [typecheck]
    env:
      ABADGE_API_URL: ${{ vars.ABADGE_API_URL || 'https://api.abadge.io' }}
      ABADGE_APP_URL: ${{ vars.ABADGE_APP_URL || 'https://abadge.io' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-build-web-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-build-web-${{ runner.os }}-
      - run: bunx turbo run build:workers --filter=@abadge/web

  db-validate:
    name: Validate Migrations
    runs-on: ubuntu-latest
    needs: [typecheck]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Apply checked-in migrations
        working-directory: packages/db
        run: bun run db:migrate

  db-migrate:
    name: Run Production Migrations
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test-unit, test-integration, test-web, e2e, build-api, build-cli, build-web, db-validate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: dopplerhq/cli-action@v3
      - working-directory: packages/db
        run: doppler run -- bun run db:migrate

  deploy-api:
    name: Deploy API
    runs-on: ubuntu-latest
    needs: [db-migrate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: dopplerhq/cli-action@v3
      - name: Verify Hyperdrive cache is disabled (§AB-0052)
        working-directory: apps/api
        run: doppler run -- bun ../../scripts/ci/check-hyperdrive-cache.ts
      - working-directory: apps/api
        run: doppler run -- bun run deploy

  deploy-web:
    name: Deploy Web
    runs-on: ubuntu-latest
    needs: [deploy-api]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: dopplerhq/cli-action@v3
      - working-directory: apps/web
        run: doppler run -- bun run deploy
