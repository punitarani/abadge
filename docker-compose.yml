services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: abadge
      POSTGRES_PASSWORD: abadge
      POSTGRES_DB: abadge
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abadge"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
